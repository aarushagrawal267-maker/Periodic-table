          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f7f4ee');

  <body>
    <noscript>
      <main class="nojs">
        <h1>Periodica: learn the periodic table by playing</h1>
        <p>
          Periodica is a free periodic table game for students. Learn and memorize all 118 elements in three-minute lessons
          and quick games, and see where each one turns up in real life. No sign-up, and it works offline once installed.
        </p>
        <p><strong>Periodica needs JavaScript to run.</strong> Turn it on in your browser settings and reload this page to start.</p>
        <h2>What you can do</h2>
        <ul>
          <li><a href="./#/learn">Learn</a>: three-minute lessons with flashcards and memory tricks, from hydrogen to the elements made in the lab</li>
          <li><a href="./#/play">Play</a>: drag-and-drop puzzles that place each element on the periodic table, region by region</li>
          <li><a href="./#/challenge">Timed challenge</a>: six levels against the clock, from 10 elements up to all 118</li>
          <li><a href="./#/daily">Daily challenge</a>: twelve elements to place, the same for everyone each day</li>
          <li><a href="./#/quiz">Quick quiz</a>: ten questions on symbols, names, atomic numbers and groups</li>
          <li><a href="./#/match">Match pairs</a>: pair element symbols with their names</li>
          <li><a href="./#/life">In real life</a>: find the elements inside everyday things like a phone or fireworks</li>
          <li><a href="./#/explore">Explore</a>: the full periodic table with facts and uses for every element</li>
        </ul>
        <h2>For teachers and parents</h2>
        <p>
          Free and private: students can play without an account, and progress stays in their browser. Periodica brings back the
          elements a student finds hard until they stick, and the Progress page shows a summary to share with a teacher.
        </p>
        <p><a href="https://github.com/aarushagrawal267-maker/Periodic-table">Source code on GitHub</a></p>
