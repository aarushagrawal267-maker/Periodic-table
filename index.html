<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#131315" />
    <meta name="description" content="Learn the periodic table in three-minute lessons and quick games. Place elements on the table, master all 118 and see where each one turns up in real life. Free, works offline, no sign-up." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Periodica · Learn the periodic table</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('periodica-settings') || '{}');
        var t = (s.state && s.state.theme) || 'system';
        if (t === 'light' || (t === 'system' && matchMedia('(prefers-color-scheme: light)').matches)) document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
