name: Deploy to GitHub Pages

# GitHub Pages serves the gh-pages branch. Every push to main tests, builds
# and replaces that branch with the fresh dist/ build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One deployment at a time; let an in-progress production deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # vite.config.ts uses base './' and the app uses hash routing,
      # so dist/ works under /<repo>/ with no 404.html SPA fallback.
      - name: Type-check and build
        run: npm run build

      - name: Publish dist/ to the gh-pages branch
        working-directory: dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
